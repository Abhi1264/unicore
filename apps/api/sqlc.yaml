version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries"
    schema: "internal/db/migrations"
    gen:
      go:
        package: "sqlcdb"
        out: "internal/db/sqlcdb"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "user_role"
            go_type: "string"
          - db_type: "tenant_status"
            go_type: "string"
          - db_type: "enrollment_status"
            go_type: "string"
          - db_type: "result_submission_status"
            go_type: "string"
          - db_type: "attendance_status"
            go_type: "string"
          - db_type: "payment_status"
            go_type: "string"
          - db_type: "document_status"
            go_type: "string"
          - db_type: "document_type"
            go_type: "string"
          - db_type: "announcement_audience"
            go_type: "string"
          - db_type: "grading_system"
            go_type: "string"
          - db_type: "academic_calendar_type"
            go_type: "string"
